name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/featurehub-sdk

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: '3.14'
    - name: Build package
      run: uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
